<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
body{margin:0;width:1200px;height:630px;background:#07070b;color:#f4f4f8;font-family:Outfit,sans-serif;display:flex;align-items:center;overflow:hidden;position:relative}
.g{position:absolute;inset:0;background:radial-gradient(40% 50% at 15% 20%,rgba(126,242,255,.16),transparent 70%),radial-gradient(40% 50% at 90% 15%,rgba(255,139,213,.15),transparent 70%),radial-gradient(50% 50% at 60% 110%,rgba(165,143,255,.2),transparent 70%)}

.i{background:linear-gradient(115deg,#7ef2ff,#a58fff 48%,#ff8bd5);-webkit-background-clip:text;color:transparent}
p{font:500 24px/1.4 Inter,sans-serif;color:#b9b9c8;margin:0}
.grid{position:relative;display:grid;grid-template-columns:repeat(7,58px);gap:10px;margin-left:30px}
